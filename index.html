<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop Blade v0.1</title>
<style>
:root{--bg:#dde1e6;--ink:#1d2229;--accent:#d41f3a;--panel:rgba(255,255,255,.72)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 24px)}
.panel{background:var(--panel);backdrop-filter:blur(6px);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.panel b{font-weight:600}
#bar{width:180px;height:8px;background:#0002;border-radius:4px;overflow:hidden;margin-top:4px}
#bar>i{display:block;height:100%;width:100%;background:var(--accent);transition:width .15s}
#spawn{pointer-events:auto;font:600 14px system-ui;padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 2px 0 #8a0c20}
#spawn:active{transform:translateY(2px);box-shadow:none}
#msg{position:fixed;inset:0;display:none;place-items:center;font:700 clamp(24px,5vw,48px) system-ui;color:var(--accent);letter-spacing:.08em;pointer-events:none;text-align:center}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:600 16px system-ui}
#help{font-size:12px;opacity:.85}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
<div id="loading">Loading simulation…</div>
<div id="hud">
  <div class="panel"><b>HP</b> <span id="hp">100</span> · <b>Kills</b> <span id="kills">0</span><div id="bar"><i></i></div></div>
  <div><button id="spawn" type="button">Spawn enemy (F)</button></div>
  <div class="panel" id="help">
    <b>Desktop:</b> mouse moves the sword · wheel = reach · right-drag or Q/E = turn · WASD = move<br>
    <b>VR:</b> right hand = sword · left stick = move · right stick = snap turn · A/X or touch the red button = spawn
  </div>
</div>
<div id="msg">SIMULATION TERMINATED</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
