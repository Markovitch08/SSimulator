name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload in its own job so the artifact is fully registered before deploy-pages looks for it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src models sounds boxing _site/
          # cache-busting: give every module and asset a per-commit URL so browsers
          # (including the Quest browser) always load the newest build
          V=${GITHUB_SHA::8}
          sed -i "s#src/main.js#src/main.js?v=$V#" _site/index.html
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" _site/src/*.js
          sed -i -E "s#models/([a-z]+)\.glb#models/\1.glb?v=$V#g" _site/src/main.js
          sed -i -E "s#sounds/([a-z]+)\.mp3#sounds/\1.mp3?v=$V#g" _site/src/main.js
          sed -i "s#boxing.js#boxing.js?v=$V#" _site/boxing/index.html
          sed -i -E "s#(from '\.\./src/[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" _site/boxing/boxing.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
